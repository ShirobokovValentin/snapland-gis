server:
  port: 8081

spring:
  application:
    name: snapland-gis
  datasource:
    url: jdbc:postgresql://localhost:5433/snapland_gis
    username: snapland
    password: snapland
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  auth:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration: PT24H
    jwt-issuer: snapland
  prototype:
    workspace-id: ${PROTOTYPE_WORKSPACE_ID}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
