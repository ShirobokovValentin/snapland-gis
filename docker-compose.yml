services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: snapland_gis
      POSTGRES_USER: snapland
      POSTGRES_PASSWORD: snapland
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapland -d snapland_gis"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
