services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: snapland_gis
      POSTGRES_USER: snapland
      POSTGRES_PASSWORD: snapland
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapland -d snapland_gis"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/snapland_gis
      SPRING_DATASOURCE_USERNAME: snapland
      SPRING_DATASOURCE_PASSWORD: snapland
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  frontend:
    build: ./frontend
    ports:
      - "4201:80"
    depends_on:
      - backend
