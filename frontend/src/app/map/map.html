<div class="map-wrapper">
  <div #mapRef class="map"></div>

  @if (pendingLayer) {
    <div class="area-panel">
      <div class="area-panel-title">New Area</div>
      <div class="area-preview">{{ previewAreaKm2 | number: '1.3-3' }} km²</div>
      <input
        [(ngModel)]="areaName"
        placeholder="Area name"
        class="area-name-input"
        [disabled]="saving"
      />
      <div class="area-panel-actions">
        <button class="btn btn-secondary" (click)="cancelDraw()" [disabled]="saving">
          Cancel
        </button>
        <button
          class="btn btn-primary"
          (click)="saveArea()"
          [disabled]="!areaName.trim() || saving"
        >
          {{ saving ? 'Saving…' : 'Save' }}
        </button>
      </div>
    </div>
  }

  @if (editingArea) {
    <div class="area-panel">
      <div class="area-panel-title">Edit Area</div>
      <div class="area-preview">v{{ editingArea.currentVersion }}</div>
      <input
        [(ngModel)]="editName"
        placeholder="Area name"
        class="area-name-input"
        [disabled]="editSaving"
      />
      <div class="area-panel-actions">
        <button class="btn btn-secondary" (click)="cancelEdit()" [disabled]="editSaving">
          Cancel
        </button>
        <button
          class="btn btn-primary"
          (click)="saveEdit()"
          [disabled]="!editName.trim() || editSaving"
        >
          {{ editSaving ? 'Saving…' : 'Save' }}
        </button>
      </div>
    </div>
  }
</div>
